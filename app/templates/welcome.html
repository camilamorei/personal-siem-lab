{% extends "base.html" %}

{% block title %}Acesso autorizado · Personal SIEM Lab{% endblock %}

{% block content %}
<div class="center">
    <main class="card">
        <div class="check">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>

        <h1>Acesso autorizado</h1>
        <p class="subtitle">Este login acabou de virar um evento de segurança.</p>

        <dl class="details">
            <div><dt>Usuário</dt><dd>{{ username }}</dd></div>
            <div><dt>Resultado</dt><dd class="t-ok">SUCCESS</dd></div>
            <div><dt>IP de origem</dt><dd>{{ ip }}</dd></div>
            <div><dt>Data e hora</dt><dd>{{ timestamp }}</dd></div>
        </dl>

        <a href="{{ url_for('home') }}" class="btn secondary">Sair</a>
    </main>
</div>
{% endblock %}

# Personal SIEM Lab alerts
# Each alert runs every 5 minutes over the last 15 minutes and triggers
# when the detection returns at least 1 result. Throttling prevents the
# same alert from firing again for 30 minutes.

[SIEM Lab - DET-01 Brute Force]
description = >= 5 failed logins from the same src_ip against the same user within 5 minutes (T1110.001)
search = index=siem_lab sourcetype=siem_lab:auth result=failure | eval event_time=_time | bin _time span=5m | stats count AS failures, min(event_time) AS first_seen, max(event_time) AS last_seen, values(reason) AS reasons BY _time, src_ip, user | where failures >= 5 | eval first_seen=strftime(first_seen, "%Y-%m-%d %H:%M:%S"), last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S") | table first_seen, last_seen, src_ip, user, failures, reasons
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 30m

[SIEM Lab - DET-02 Password Spraying]
description = Failed logins against more than 5 distinct users from the same src_ip within 15 minutes (T1110.003)
search = index=siem_lab sourcetype=siem_lab:auth result=failure | eval event_time=_time | bin _time span=15m | stats dc(user) AS distinct_users, count AS failures, values(user) AS users_tried, min(event_time) AS first_seen BY _time, src_ip | where distinct_users > 5 | eval first_seen=strftime(first_seen, "%Y-%m-%d %H:%M:%S") | table first_seen, src_ip, distinct_users, failures, users_tried
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 30m

[SIEM Lab - DET-03 Success After Failures]
description = Successful login after >= 5 failures from the same src_ip against the same user within 10 minutes (T1110.001 -> T1078)
search = index=siem_lab sourcetype=siem_lab:auth | eval event_time=_time | eval fail_time=if(result="failure", event_time, null()), success_time=if(result="success", event_time, null()) | bin _time span=10m | stats count(fail_time) AS failures, count(success_time) AS successes, min(fail_time) AS first_failure, max(success_time) AS compromised_at BY _time, src_ip, user | where failures >= 5 AND successes >= 1 AND compromised_at > first_failure | eval first_failure=strftime(first_failure, "%Y-%m-%d %H:%M:%S"), compromised_at=strftime(compromised_at, "%Y-%m-%d %H:%M:%S") | table first_failure, compromised_at, src_ip, user, failures, successes
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.track = 1
alert.severity = 5
alert.digest_mode = 1
alert.suppress = 1
alert.suppress.period = 30m
